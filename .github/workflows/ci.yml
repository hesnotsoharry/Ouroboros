name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly full-suite backstop. Affected-only selection (the Test step below)
  # runs only tests the static import graph links to the diff — it can miss a
  # cross-process break wired by runtime channel strings, not imports. The
  # weekly full run catches those. Monday 06:00 UTC, mirroring ci-stryker.
  schedule:
    - cron: '0 6 * * 1'
  # Manual full run — trigger from the Actions tab (e.g. before a release).
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # macOS leg disabled 2026-05-29: no Mac hardware to validate against yet,
        # so the macOS runner is redundant. Re-add 'macos-latest' to restore it.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 40-min job budget. Affected-only runs (the common push/PR case) finish in
    # minutes, but the weekly full-suite backstop is ~25–30 min on CI runners
    # (~17 min Windows-local, runners ~1.5–2× slower) on top of ~10 min setup.
    # 35 was too tight for the full run to clear comfortably; bumped 35 → 40.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 — `vitest --changed` diffs the working tree against a
        # base SHA to find changed files. The default depth-1 shallow clone has
        # no base commit to diff against, so --changed would see everything.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install native build prerequisites (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # xvfb added for Pipeline Hardening M-4 — Electron needs a virtual display
          # for the chromium renderer when running headless on Linux CI.
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 xvfb || \
          sudo apt-get install -y build-essential python3 libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2 xvfb

      # --ignore-scripts skips the postinstall electron-rebuild + changelog steps.
      # The postinstall electron-rebuild hangs at "Searching dependency tree" on
      # all 3 platforms after the node-gyp@^11 override unblocked distutils. We
      # run electron-rebuild explicitly below so it can fail/succeed on its own
      # timer without taking the entire `npm ci` step with it, and so the
      # changelog script doesn't gate everything else either.
      - run: npm ci --ignore-scripts

      # --ignore-scripts above skips electron's postinstall (node install.js),
      # which downloads the Electron binary and writes node_modules/electron/path.txt.
      # Without path.txt, any test file that imports electron-log, electron-store,
      # or the electron package itself throws "Electron failed to install correctly".
      # Run the install script explicitly here, mirroring the pattern used for
      # electron-rebuild below.
      - name: Download Electron binary (postinstall replacement)
        run: node node_modules/electron/install.js

      - name: Generate changelog (postinstall replacement)
        run: node tools/build-changelog.js

      # Rebuild native modules against Electron's Node ABI on every platform.
      # Replaces the postinstall electron-rebuild that was timing out at 20min.
      # `-w better-sqlite3,node-pty` restricts to the two native deps we ship.
      #
      # Use --package=@electron/rebuild explicit to force resolution to the
      # maintained scoped package (v4+). The bare `electron-rebuild` binary
      # name on npm is also published by the deprecated unscoped package,
      # which has a `Searching dependency tree` hang on CI. The explicit
      # --package flag bypasses any binary-name collision in node_modules/.bin.
      - name: Rebuild native modules for Electron (all platforms)
        timeout-minutes: 15
        run: npx --package=@electron/rebuild electron-rebuild -f -w better-sqlite3,node-pty

      - name: Rebuild native modules (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: npm rebuild

      - name: Install better-sqlite3 for system Node (vitest needs Node ABI, not Electron ABI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/Temp/sqlite-fresh
          cd /tmp/Temp/sqlite-fresh
          npm init -y
          npm install better-sqlite3

      - name: Install better-sqlite3 for system Node (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Temp\sqlite-fresh"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          npm init -y
          npm install better-sqlite3

      - name: Install better-sqlite3 for system Node (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p /tmp/Temp/sqlite-fresh
          cd /tmp/Temp/sqlite-fresh
          npm init -y
          npm install better-sqlite3

      - name: Lockfile cross-platform completeness check
        run: node scripts/lockfile-smoke.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Affected-only test selection. push/PR → run only tests whose module
      # graph touches the diff (`vitest --changed <base>`). schedule / manual
      # dispatch → empty args → FULL suite (the weekly backstop). bash runs on
      # both ubuntu and windows runners (git-bash), so the logic is uniform.
      - name: Select test scope
        id: scope
        shell: bash
        # Context values pass through env vars, not direct ${{ }} interpolation
        # into the script body — GitHub's script-injection-hardening pattern.
        # (These specific values are GitHub-set hex SHAs / fixed event names and
        # not attacker-controllable, but env-var indirection is safe-by-default
        # so the pattern stays safe if a maintainer adds a richer context value.)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Full suite (event: $EVENT_NAME)"
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Affected tests vs PR base $PR_BASE_SHA"
            echo "args=--changed $PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            # All-zeros sentinel = new branch / force-push with no valid base.
            if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              echo "No valid base SHA — full suite"
              echo "args=" >> "$GITHUB_OUTPUT"
            else
              echo "Affected tests vs $PUSH_BEFORE"
              echo "args=--changed $PUSH_BEFORE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Test
        # Affected-only on push/PR (minutes); full suite on schedule/dispatch.
        # 30-min budget covers the weekly full run: local Windows suite is ~17
        # min (2026-05-14, 1065 files / 10993 tests); CI runners ~1.5–2× slower
        # (~25–30 min), so 25 sat at the lower bound. Bumped 25 → 30.
        # --passWithNoTests: a docs/comment-only diff has zero affected tests;
        # without it `vitest run` exits non-zero and fails the build.
        timeout-minutes: 30
        run: npm run test -- --reporter=verbose --passWithNoTests ${{ steps.scope.outputs.args }}

      - name: Build (Electron)
        run: npm run build

      - name: Smoke-test web build (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:web

      # Playwright Electron e2e — DISABLED 2026-05-15 pending a focused
      # fix-wave. The harness installs cleanly (chrome-sandbox chmod +
      # playwright install both work under xvfb), but every test fails
      # with "Worker teardown timeout of 60000ms exceeded" — Electron
      # isn't shutting down cleanly after each test on Linux + xvfb.
      # That's a NEW issue, distinct from the per-spec drift already
      # tracked in roadmap/follow-ups/2026-05-13-electron-e2e-spec-drift.md.
      # See roadmap/bugs/2026-05-15-e2e-teardown-hang.md for repro + plan.
      #
      # Originally added in Pipeline Hardening M-4 (Ubuntu-only via xvfb,
      # stable subset = 9 tests / 3 specs). Manual smoke gate
      # (roadmap/session-handoff.md) is the active UI-defense meanwhile.
      #
      # To re-enable: uncomment the three step blocks below + the
      # "Upload Playwright report" step.
      #
      # - name: Install Playwright browsers (Ubuntu only)
      #   if: matrix.os == 'ubuntu-latest'
      #   run: npx playwright install chromium chromium-headless-shell
      #
      # - name: Configure Electron chrome-sandbox setuid (Ubuntu only)
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     sudo chown root:root node_modules/electron/dist/chrome-sandbox
      #     sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      #
      # - name: Playwright e2e (Electron stable subset, Ubuntu only)
      #   if: matrix.os == 'ubuntu-latest'
      #   timeout-minutes: 25
      #   run: xvfb-run --auto-servernum npm run test:e2e
